  <polygon points="514,270 500,261 500,279" fill="#e8d7ae"/>

  <text x="230" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#e8d7ae">25 Basis Points</text>
  <text x="670" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#e8d7ae">75 Basis Points</text>

  <text x="210" y="418" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#e8d7ae">Discipline</text>
  <text x="450" y="418" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#e8d7ae">Integrity</text>
  <text x="690" y="418" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#e8d7ae">Prosperity</text>
